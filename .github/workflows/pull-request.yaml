name: Pull Requests

on:
  pull_request:
    branches:
      - main

jobs:
  version-check:
    name: Version Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Check All Versions Match
        run: |
          pkg_version=$(grep -P -o 'version = "\d+\.\d+\.\d+"' pyproject.toml | grep -P -o '\d+\.\d+\.\d+')
          rock_version=$(grep -P -o 'version: "\d+\.\d+\.\d+"' rock/*/rockcraft.yaml | grep -P -o '\d+\.\d+\.\d+' | sort -uV | tail -n1)
          snap_version=$(grep -P -o "version: '\d+\.\d+\.\d+'" snap/latest/snap/snapcraft.yaml | grep -P -o '\d+\.\d+\.\d+')
          [ "${pkg_version}" == "${rock_version}" ]
          [ "${pkg_version}" == "${snap_version}" ]
  changelog-check:
    name: Changelog Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Check for non-changelog Changes
        id: non-changelog-files
        uses: tj-actions/changed-files@v35
        with:
          files: '**'
          files_ignore: '.github/workflows/**'
      - name: Check for Change to Changelog.md
        id: changed-files
        uses: tj-actions/changed-files@v35
        with:
          files: CHANGELOG.md
      - name: Fail If No Change
        if: ${{ steps.non-changelog-files.outputs.any_changed == 'true' }}
        run: |
          [ "${{ steps.changed-files.outputs.any_changed }}" == "true" ]
  linting:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set Up Python
        uses: actions/setup-python@v4
      - name: Install Dependencies
        run: python3 -m pip install tox
      - name: Run Checks
        run: tox -e lint,static
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set Up Python
        uses: actions/setup-python@v4
      - name: Install Dependencies
        run: python3 -m pip install tox
      - name: Run Checks
        run: tox -e test,slow-tests
      - name: Upload .coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: .coverage
          include-hidden-files: true
  coverage:
    name: Coverage
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set Up Python
        uses: actions/setup-python@v4
      - name: Install Dependencies
        run: python3 -m pip install tox
      - name: Download .coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage
      - name: Run Checks
        run: tox -e coverage

  pull-request-rock:
    name: PR for rock
    uses: canonical/observability/.github/workflows/rock-pull-request.yaml@v2
    secrets: inherit
    with:
      rock-path: rock

  pull-request-snap:
    name: PR for snap
    uses: canonical/observability/.github/workflows/snap-pull-request.yaml@v2
    secrets: inherit
    with:
      snap-path: snap
